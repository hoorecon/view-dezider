# Local-dev / single-node compose stack.
# Used as a self-contained testbed before AWS/GCP deploy.
#
# Up:    docker compose -f deploy/docker-compose.yml up -d
# Logs:  docker compose -f deploy/docker-compose.yml logs -f api
# Down:  docker compose -f deploy/docker-compose.yml down -v

version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
    ports:
      - "127.0.0.1:27017:27017"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://mongo:27017/dezider"
      DB_NAME: "dezider"
      DEZIDER_ENV: "stage"
      DEZIDER_VERSION: "docker-stage"
      SECURITY_HEADERS_ENABLED: "true"
      HSTS_ENABLED: "false"
      MAX_BODY_BYTES: "10485760"        # 10MB
      RATE_LIMIT_DEFAULT: "120/minute"
      RATE_LIMIT_AUTH: "10/minute"
      RATE_LIMIT_AI: "10/minute"
      METRICS_ENABLED: "true"
      # METRICS_TOKEN: "set-me-in-prod"
      # EMERGENT_LLM_KEY: "<set-from-secret>"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health/live', timeout=3)"]
      interval: 30s
      retries: 3

volumes:
  mongo_data:
