# Production compose stack (Atlas-backed).
# Up:    docker compose -f deploy/docker-compose.yml up -d
# Logs:  docker compose -f deploy/docker-compose.yml logs -f api

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Env loading priority (later entries override earlier ones):
    #   1. ../backend/.env   → required, the source-controlled sample/dev config
    #   2. ./.env            → optional, ops-managed prod secrets (placed
    #                          next to docker-compose.yml on the EC2 host).
    #                          Use this for LLM keys, Razorpay, SMTP, etc.
    env_file:
      - path: ../backend/.env
        required: true
      - path: ./.env
        required: false
    environment:
      DEZIDER_ENV: "prod"
      DEZIDER_VERSION: "v3.15.0"
      SECURITY_HEADERS_ENABLED: "true"
      HSTS_ENABLED: "true"
      MAX_BODY_BYTES: "10485760"
      RATE_LIMIT_DEFAULT: "120/minute"
      RATE_LIMIT_AUTH: "10/minute"
      RATE_LIMIT_AI: "10/minute"
      METRICS_ENABLED: "true"
    volumes:
      # Mount the docs/ directory from host into the container so the
      # admin_docs_viewer endpoint can read PRD.md / SRS.md / etc.
      # Without this mount the markdown viewer returns 404 for every doc.
      - ../docs:/app/docs:ro
      # Mount README.md from the repo root so /api/version can read the
      # BUILD_VERSION / BUILD_TAG / BUILD_TIMESTAMP markers. Without this
      # mount the endpoint returns "unknown" for everything because the
      # docker build context is `../backend` only (no repo-root files).
      - ../README.md:/app/README.md:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health/live', timeout=3)"]
      interval: 30s
      retries: 3
