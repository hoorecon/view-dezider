apiVersion: v1
kind: Namespace
metadata:
  name: dezider
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dezider-api-config
  namespace: dezider
data:
  DEZIDER_ENV: "prod"
  DEZIDER_VERSION: "k8s-prod"
  SECURITY_HEADERS_ENABLED: "true"
  HSTS_ENABLED: "true"
  HSTS_MAX_AGE: "63072000"
  MAX_BODY_BYTES: "10485760"
  GZIP_MIN_SIZE: "1024"
  RATE_LIMIT_DEFAULT: "120/minute"
  RATE_LIMIT_AUTH: "10/minute"
  RATE_LIMIT_AI: "10/minute"
  RATE_LIMIT_EXPENSIVE: "20/minute"
  RATE_LIMIT_PUBLIC: "60/minute"
  METRICS_ENABLED: "true"
  SLOW_REQUEST_MS: "800"
---
apiVersion: v1
kind: Secret
metadata:
  name: dezider-api-secrets
  namespace: dezider
type: Opaque
stringData:
  # Replace these BEFORE applying!
  MONGO_URL: "mongodb+srv://USER:PASS@cluster.mongodb.net/dezider?retryWrites=true&w=majority"
  DB_NAME: "dezider"
  EMERGENT_LLM_KEY: ""
  METRICS_TOKEN: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  ULTRAMSG_TOKEN: ""
  EXOTEL_API_KEY: ""
  DIGILOCKER_CLIENT_ID: ""
  DIGILOCKER_CLIENT_SECRET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dezider-api
  namespace: dezider
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dezider-api
  template:
    metadata:
      labels:
        app: dezider-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/api/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["dezider-api"]
              topologyKey: kubernetes.io/hostname
      containers:
      - name: api
        image: dezider/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        envFrom:
        - configMapRef:
            name: dezider-api-config
        - secretRef:
            name: dezider-api-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health/live
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30   # 30 * 5s = 150s startup budget
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: false   # /app/backend writes to ./static
---
apiVersion: v1
kind: Service
metadata:
  name: dezider-api
  namespace: dezider
  labels:
    app: dezider-api
spec:
  type: ClusterIP
  selector:
    app: dezider-api
  ports:
  - port: 80
    targetPort: 8001
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dezider-api-hpa
  namespace: dezider
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dezider-api
  minReplicas: 4
  maxReplicas: 40
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dezider-api-pdb
  namespace: dezider
spec:
  minAvailable: 75%
  selector:
    matchLabels:
      app: dezider-api
---
# Hourly DPDP purge cron — calls the admin endpoint with a service token.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dezider-dpdp-purge
  namespace: dezider
spec:
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: purge
            image: curlimages/curl:8.7.1
            command: ["sh", "-c"]
            args:
            - >-
              curl -fsS -X POST -H "Authorization: Bearer $ADMIN_TOKEN"
              http://dezider-api.dezider.svc.cluster.local/api/dpdp/admin/purge-pending
            envFrom:
            - secretRef:
                name: dezider-api-secrets
