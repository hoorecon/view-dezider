name: Build & Deploy Jelcos Frontend (Cloudflare Pages)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment (dev, staging, prod)'
        required: true
        default: 'dev'

  push:
    branches:
      - jelcos-dev

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Build & Deploy Expo Web to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: jelcos-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Expo Web Bundle
        working-directory: ./frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: https://dev-api.jelcos.ai
          EXPO_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          EXPO_PUBLIC_POSTHOG_KEY: phc_ziRrdHFoqZfsvz55irm3d7PqEZpSDYcP7MGgrkXLNVu8
        run: npx expo export --platform web

      - name: Ensure Cloudflare Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create jelcos-dev --production-branch=jelcos-dev || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=jelcos-dev --commit-dirty=true